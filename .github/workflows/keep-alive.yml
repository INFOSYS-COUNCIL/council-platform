# Supabase Free 프로젝트는 일주일 동안 활동이 없으면 일시 중지된다.
# 주 2회 dev·prod DB에 가벼운 요청을 보내 중지를 막는다.
# 저장소 Settings → Secrets and variables → Actions에 아래 값을 넣어야 동작한다.
#   SUPABASE_DEV_URL, SUPABASE_DEV_PUBLISHABLE_KEY
#   SUPABASE_PROD_URL, SUPABASE_PROD_PUBLISHABLE_KEY
# 값이 없으면 그 환경은 건너뛴다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 * * 1,4" # 월·목 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            url_secret: SUPABASE_DEV_URL
            key_secret: SUPABASE_DEV_PUBLISHABLE_KEY
          - env: prod
            url_secret: SUPABASE_PROD_URL
            key_secret: SUPABASE_PROD_PUBLISHABLE_KEY
    steps:
      - name: Ping ${{ matrix.env }}
        env:
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "${{ matrix.env }}: secret이 없어 건너뜁니다."
            exit 0
          fi
          # ACTIVE 기수 조회. 로그인하지 않은 요청이라 권한 오류가 나도 DB에는 요청이 도달한다.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/terms?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "${{ matrix.env }}: HTTP $status"
          case "$status" in
            2*|401|403) exit 0 ;;
            *) exit 1 ;;
          esac
